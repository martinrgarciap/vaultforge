[package]
name = "hash-service"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
argon2 = { version = "0.5", features = ["std"] }
tonic-health = "0.14"
tonic-reflection = "0.14.6"

[build-dependencies]
tonic-prost-build = "0.14"
