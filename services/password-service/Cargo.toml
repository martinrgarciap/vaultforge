[package]
name = "password-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tonic-health = "0.14"
tonic-reflection = "0.14.6"
rand = "0.8"
zxcvbn = "3"

[build-dependencies]
tonic-prost-build = "0.14"