services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: vaultforge
      POSTGRES_USER: vaultforge
      POSTGRES_PASSWORD: vaultforge_local_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - vaultforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:8.8.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  vaultforge_postgres_data:
