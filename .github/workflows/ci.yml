name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: vaultforge_test
          POSTGRES_USER: vaultforge
          POSTGRES_PASSWORD: vaultforge_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultforge -d vaultforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 5s

    env:
      TEST_DATABASE_URL: postgres://vaultforge:vaultforge_ci_test@127.0.0.1:5432/vaultforge_test?sslmode=disable

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Staticcheck
        run: staticcheck ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
