name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: vaultforge_test
          POSTGRES_USER: vaultforge
          POSTGRES_PASSWORD: vaultforge_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultforge -d vaultforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 5s

      redis:
        image: redis:8.8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
          --health-start-period 5s

    env:
      TEST_DATABASE_URL: postgres://vaultforge:vaultforge_ci_test@127.0.0.1:5432/vaultforge_test?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/1

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Staticcheck
        run: staticcheck ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

  web:
    name: Web checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs:
      - go
      - web
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: vaultforge_e2e
          POSTGRES_USER: vaultforge
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultforge -d vaultforge_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 5s

      redis:
        image: redis:8.8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
          --health-start-period 5s

    env:
      E2E_DATABASE_URL: postgres://vaultforge:test@127.0.0.1:5432/vaultforge_e2e?sslmode=disable
      E2E_REDIS_URL: redis://127.0.0.1:6379/2

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply database migrations
        run: |
          for migration in apps/api/migrations/*.up.sql; do
            echo "Applying $migration"
            psql "$E2E_DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -f "$migration"
          done

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run real-stack browser test
        working-directory: apps/web
        run: npm run test:e2e

  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/hash-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
