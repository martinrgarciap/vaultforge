syntax = "proto3";

package vaultforge.password.v1;

option go_package = "github.com/martinrgarciap/vaultforge/apps/api/internal/passwordpb;passwordpb";

// PasswordService generates passwords and rates password strength.
//
// Scope: account-level password generation and strength rating for VaultForge's
// public generator page and registration form. This service does NOT handle
// vault-item secrets (those are browser-side only) or account password hashing
// (that is the separate hash-service).
service PasswordService {
  // Generate a random password from the requested character classes.
  rpc Generate(GenerateRequest) returns (GenerateResponse);

  // Rate the strength of a provided password (zxcvbn-based, score 0-4).
  rpc CheckStrength(CheckStrengthRequest) returns (CheckStrengthResponse);
}

// --- Generate ---

message GenerateRequest {
  // Desired password length (validated against a sane min/max).
  uint32 length = 1;

  // Which character classes to include. At least one must be true.
  bool include_uppercase = 2;
  bool include_lowercase = 3;
  bool include_digits = 4;
  bool include_symbols = 5;

  // Characters to exclude from the pool (e.g. ambiguous chars). Optional.
  string exclude_chars = 6;
}

message GenerateResponse {
  // The generated password.
  string password = 1;

  // Estimated entropy of the generated password, in bits.
  double entropy_bits = 2;
}

// --- CheckStrength ---

message CheckStrengthRequest {
  // The password to rate. Never logged or echoed.
  string password = 1;
}

message CheckStrengthResponse {
  // zxcvbn score, 0 (weakest) to 4 (strongest).
  uint32 score = 1;

  // Human-readable label derived from the score, e.g. "weak", "strong".
  string label = 2;

  // Estimated entropy in bits.
  double entropy_bits = 3;

  // Human-readable crack-time estimate, e.g. "3 hours", "centuries".
  string crack_time_estimate = 4;

  // Optional suggestions for improving the password.
  repeated string suggestions = 5;
}